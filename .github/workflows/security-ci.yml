name: DuoMind Security & Testing CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  test-and-security:
    name: Security & Testing Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ==========================================
      # 1. FRONTEND: SECURITY & BUILD TESTING
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Frontend Vulnerability Scan (NPM Audit)
        run: npm audit --audit-level=high
        working-directory: ./frontend

      - name: Frontend Build Test (Ensures code compiles correctly)
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"

      # ==========================================
      # 2. BACKEND: SECURITY & API TESTING
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Backend Dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system bandit ruff pytest httpx
        working-directory: ./backend

      - name: Backend Security Scan (Bandit)
        run: bandit -r app/ -c "bandit.yaml" || true
        working-directory: ./backend

      - name: Backend API Unit Tests & Health Checks
        run: pytest tests/ -v
        working-directory: ./backend
        env:
          PYTHONPATH: "."
          GEMINI_API_KEY: "dummy"
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_KEY: "dummy"
          MONGO_URI: "mongodb://localhost:27017"
          ENCRYPTION_KEY: "6g3xVl01Ys9yw--MW0dSWNVnHO0gfrPgQ6yI33o5vHA="
